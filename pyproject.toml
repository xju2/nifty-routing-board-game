[build-system]
requires = ["uv_build >= 0.9.21, <0.10.0"]
build-backend = "uv_build"

[project]
name = "routing_board_game"
version = "0.1.0"
description = "Routing board game simulation and analysis tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.1",
    "flask>=3.1.2",
    "flask-cors>=4.0.1",
    "gymnasium>=1.2.2",
    "protobuf>=6.33.4",
    "pygame>=2.6.1",
    "shimmy>=2.0.0",
    "stable-baselines3>=2.7.0",
    "tensorboard>=2.20.0",
]

[project.scripts]
nifty = "routing_board_game.cli.main:main"

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    "pytest>=9.0.2",
    "ruff>=0.14.6",
]
