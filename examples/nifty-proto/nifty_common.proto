syntax = "proto3";

package nifty_common.v1;

message NDArray {
  enum DataType {
    FLOAT32 = 0;
    FLOAT64 = 1;
    INT64 = 2;
    INT32 = 3;
    UINT8 = 4;
  }
  DataType dtype = 1;
  repeated int64 shape = 2;
  bytes raw_data = 3;
}

// Fixed Index Definitions.
// Every NDArray MUST conform to these column indices.
message GraphConstants {
  enum NodeColumn {
    NODE_PACKET = 0;  // Count of packets
    NODE_HOPS = 1;    // Hop count
    // Future features must be appended here
  }

  enum EdgeColumn {
    EDGE_CONGESTION = 0; // Congestion level (0.0 - 1.0)
    // Future features must be appended here
  }
}

message GraphBatch {
  string version = 1;       // Schema versioning for backward compatibility
  string creator_id = 2;   // e.g., "Simulation_Group_A"

  // Nodes: shape [N, 2] -> Col 0: Packet, Col 1: Hops
  NDArray nodes = 3;

  NDArray edge_index = 4;    // Shape: [2, E] (Source, Target)

  // Edge Attributes: shape [E, 1] -> Col 0: Congestion
  NDArray edge_attributes = 5;

  NDArray global_context = 6;  // Shape: [D_global]

  // Extensibility
  map<string, NDArray> auxiliary_data = 7; // For custom team-specific outputs
  map<string, string> metadata = 8;        // Timestamps, simulation parameters, etc.
}